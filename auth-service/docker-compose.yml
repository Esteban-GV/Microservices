services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: egv
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: microservice_egv
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egv -d microservice_egv"]
      interval: 5s
      timeout: 5s
      retries: 5

  java_app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - DATABASE_USERNAME=egv
      - DATABASE_PASSWORD=pass
      - JWT_SECRET=VGhpcyBJcyBBIFZlcnkgU2VjdXJlIEtleSBGb3IgSldUIEF1dGhlbnRpY2F0aW9u

volumes:
  db_data:
