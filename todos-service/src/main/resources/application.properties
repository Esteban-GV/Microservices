spring.application.name=todos-service
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://todos-db:5432/microservice_todos
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Debe ser EXACTAMENTE el mismo valor que jwt.secret en auth-service
jwt.secret=${JWT_SECRET}

server.port=8081

spring:
  jpa:
    hibernate:
      ddl-auto: update # Esto crea las tablas automáticamente si no existen
    show-sql: true